name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows app
        run: npm run tauri build

      - name: List bundle output
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse |
            Select-Object FullName, Length, LastWriteTime

      - name: Publish Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "windows-latest"
          $title = "Windows Latest"
          $notes = "Automated Windows build for $env:GITHUB_SHA"
          $assets = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe", "*.msi" |
            Select-Object -ExpandProperty FullName
          if (-not $assets) {
            throw "No Windows installer assets found."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes $notes --target $env:GITHUB_SHA --latest=false
          } else {
            gh release edit $tag --title $title --notes $notes --target $env:GITHUB_SHA --latest=false
          }
          gh release upload $tag @assets --clobber
