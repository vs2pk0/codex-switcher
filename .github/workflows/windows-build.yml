name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare version release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; installers will be replaced in place."
          else
            gh release create "${tag}" \
              --draft \
              --title "Codex Switcher ${tag}" \
              --notes "Desktop builds are in progress for ${GITHUB_SHA}" \
              --target "${GITHUB_SHA}"
          fi

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run tauri build

      - name: Collect Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-assets/windows" | Out-Null
          $assets = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe", "*.msi"
          if (-not $assets) {
            throw "No Windows installer assets found."
          }
          $assets | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "release-assets/windows/$($_.Name)" -Force
          }
          Get-ChildItem -Path "release-assets/windows" | Select-Object FullName, Length, LastWriteTime

      - name: Upload Windows installers to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(Get-ChildItem -Path "release-assets/windows" -File)
          if (-not $assets) {
            throw "No Windows installer assets found."
          }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          & gh release upload $env:RELEASE_TAG @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading Windows installers to release failed with exit code $LASTEXITCODE."
          }

  macos:
    name: macOS
    runs-on: macos-15
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run tauri build

      - name: Build macOS PKG installer
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app_path="src-tauri/target/release/bundle/macos/Codex Switcher.app"
          pkg_dir="src-tauri/target/release/bundle/pkg"
          arch="$(uname -m)"
          pkg_path="${pkg_dir}/Codex Switcher_${version}_${arch}.pkg"

          if [ ! -d "${app_path}" ]; then
            echo "macOS application bundle not found: ${app_path}" >&2
            exit 1
          fi

          mkdir -p "${pkg_dir}"
          pkgbuild \
            --component "${app_path}" \
            --identifier "com.codex.switcher.pkg" \
            --version "${version}" \
            --install-location "/Applications" \
            "${pkg_path}"

          test -s "${pkg_path}"
          pkgutil --payload-files "${pkg_path}" | grep -F "Codex Switcher.app" >/dev/null

      - name: Collect macOS installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release-assets/macos"
          find "src-tauri/target/release/bundle" -type f \( -name "*.dmg" -o -name "*.pkg" -o -name "*.tar.gz" \) -print0 |
            while IFS= read -r -d '' asset; do
              cp "$asset" "release-assets/macos/$(basename "$asset")"
            done
          if ! find "release-assets/macos" -type f | grep -q .; then
            echo "No macOS installer assets found." >&2
            exit 1
          fi
          ls -lh "release-assets/macos"

      - name: Upload macOS installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r asset; do
            assets+=("${asset}")
          done < <(find "release-assets/macos" -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS installer assets found." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber

  finalize-release:
    name: Finalize version release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - windows
      - macos

    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --latest \
            --title "Codex Switcher ${RELEASE_TAG}" \
            --notes "Automated Windows and macOS build for ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
